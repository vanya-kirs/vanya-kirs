[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telegram-lead-parser"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "telethon>=1.36.0",
    "aiogram>=3.7.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "celery[redis]>=5.4.0",
    "redis>=5.0.4",
    "anthropic>=0.28.0",
    "pydantic-settings>=2.3.0",
    "pydantic>=2.7.0",
    "openpyxl>=3.1.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic[email]>=2.7.0",
    "python-socks[asyncio]>=2.4.0",
    "aiohttp-socks>=0.8.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "fakeredis>=2.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
